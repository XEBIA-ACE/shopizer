
authToken.header=Authorization

#JWT authentication configuration for sm-shop
jwt.header=Authorization
jwt.secret=aSecret
jwt.expiration= 604800

#Password reset configuration
#HMAC key used to hash reset tokens before they are stored, override in each environment
password.reset.token.secret=aResetSecret
#Reset token validity in seconds
password.reset.token.expiration=3600
#Reject reset links that are not HTTPS (loopback hosts are allowed for local development)
password.reset.https.required=true


