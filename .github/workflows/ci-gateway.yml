name: CI Gateway

on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/ci-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/ci-gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
