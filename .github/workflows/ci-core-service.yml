name: CI Core Service

on:
  pull_request:
    paths:
      - 'core-service/**'
      - '.github/workflows/ci-core-service.yml'
  push:
    branches: [main]
    paths:
      - 'core-service/**'
      - '.github/workflows/ci-core-service.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and enforce coverage
        run: mvn -B verify
