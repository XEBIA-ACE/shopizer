<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; margin: 0; }
  .registration { max-width: 420px; margin: 48px auto; padding: 32px; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  h1 { font-size: 1.5em; margin-top: 0; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-weight: bold; margin-bottom: 6px; }
  input[type="email"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
  input[aria-invalid="true"] { border-color: #c0392b; }
  .field-error { display: block; color: #c0392b; font-size: .9em; margin-top: 6px; }
  .field-error:empty { display: none; }
  .form-message { padding: 12px; border-radius: 4px; margin-bottom: 18px; }
  .form-message[hidden] { display: none; }
  #form-confirmation { background: #e8f6ec; color: #1e7e34; }
  #form-error { background: #fdecea; color: #c0392b; }
  button { width: 100%; padding: 12px; background: #2c3e50; color: #fff; border: 0; border-radius: 4px; font-size: 1em; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main class="registration">
  <h1>Create your account</h1>
  <div id="form-confirmation" class="form-message" role="status" hidden></div>
  <div id="form-error" class="form-message" role="alert" hidden></div>
  <form id="registration-form" action="register" method="post" novalidate>
    <div class="form-group">
      <label for="emailAddress">Email address</label>
      <input type="email" id="emailAddress" name="emailAddress" autocomplete="email" required aria-describedby="email-error">
      <span class="field-error" id="email-error" aria-live="polite"></span>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="password-error">
      <span class="field-error" id="password-error" aria-live="polite"></span>
    </div>
    <button type="submit" id="register-submit">Create account</button>
  </form>
</main>
<script id="registration-rules" type="application/json">__REGISTRATION_RULES__</script>
<script src="js/register-validation.js"></script>
</body>
</html>
